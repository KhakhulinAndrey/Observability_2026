[SERVICE]
    # Flush
    # =====
    # set an interval of seconds before to flush records to a destination
    flush        5
    log_level    info

    # Parsers File
    # ============
    # specify an optional 'Parsers' configuration file
    parsers_file parsers.conf

    # Plugins File
    # ============
    # specify an optional 'Plugins' configuration file to load external plugins.
    plugins_file plugins.conf
# Сбор системных логов
[INPUT]
    Name tail
    Path /var/log/syslog
    Tag system.syslog

# Сбор логов ошибок MySQL
[INPUT]
    Name tail
    Path /var/log/mysql/error.log
    Tag mysql.error
    Read_from_Head true

# Сбор логов медленных запросов MySQL (если включены)
[INPUT]
    Name tail
    Path /var/log/mysql/mysql-slow.log
    Tag mysql.slow
    Read_from_Head true

# Отправка в Data Prepper
[OUTPUT]
    Name http
    Match *
    Host xxx.xxx.xxx.94
    Port 2021
    URI /log/ingest
    Format json