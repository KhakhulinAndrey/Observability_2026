
filter {
  if [event][dataset] == "nginx.access" {
    grok {
      match => { "message" => "%{IPORHOST:client_ip} - %{USER:ident} \[%{HTTPDATE:timestamp}\] \"%{WORD:method} %{URIPATHPARAM:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status} %{NUMBER:body_bytes_sent} \"%{DATA:referrer}\" \"%{DATA:user_agent}\"" }
    }
    # Преобразуем строку времени в нормальный формат @timestamp
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
    # Удаляем лишние поля, чтобы не засорять индекс
    mutate {
      remove_field => ["message", "timestamp"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    user => "elastic"
    password => "dxxxxxxxxxxxxxxxUM"
    ssl_verification_mode => "none"
    index => "logstash-nginx-%{+YYYY.MM.dd}"
  }
}