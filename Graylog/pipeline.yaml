log-pipeline:
  source:
    http:
      port: 2021
      ssl: false
  processor:
    - grok:
        match:
          # Указываем, что парсить нужно поле "log" (так Fluent Bit может назвать поле с сырой строкой)
          # Если Fluent Bit отправляет поле "message", замените "log" на "message"
          log: [ "%{COMMONAPACHELOG}" ]
        # Блок обработки ошибок для grok
        on_error:
          # Если строка не подошла под паттерн, просто пропускаем её дальше
          # (или можно добавить тег/поле, чтобы потом отфильтровать)
          - add_entries:
              entries:
                - key: "grok_failed"
                  value: true
    - date:
        match:
          - key: "timestamp"
            patterns: ["dd/MMM/yyyy:HH:mm:ss Z"]
        destination: "@timestamp"
        # Блок обработки ошибок для date
        on_error:
          - add_entries:
              entries:
                - key: "date_failed"
                  value: true
    - convert_type:
        keys: ["response", "bytes"]
        type: integer
  sink:
    - opensearch:
        hosts: ["https://host.docker.internal:9200"] # Если OpenSearch на хосте, а не в Docker
        # Если OpenSearch в Docker-сети, используйте имя контейнера, например: ["https://opensearch:9200"]
        insecure: true
        username: "admin"
        password: "Civic117004!"
        index: "fluent-bit-logs-%{yyyy.MM.dd}"
    - stdout: # Полезно для отладки, чтобы видеть, что приходит в Data Prepper