filebeat.inputs:
- type: filestream
  id: nginx-logs
  paths:
    - /var/log/nginx/access.log
    - /var/log/nginx/error.log
  fields_under_root: true
  fields:
    log_type: nginx

- type: filestream
  id: mysql-logs
  paths:
    - /var/log/mysql/error.log
  fields_under_root: true
  fields:
    log_type: mysql

- type: filestream
  id: php-logs
  paths:
    - /var/log/php8.5-fpm.log
  fields_under_root: true
  fields:
    log_type: php-fpm

output.logstash:
  hosts: ["000.000.000.94:5044"]